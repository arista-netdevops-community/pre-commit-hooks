[package]
name = "arista-pre-commit-hooks"
version = "0.1.8"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Rust-based pre-commit hooks for cargo workflows"
publish = false

[dependencies]
# These dependencies support the local cargo-about CLI adapter in src/about.rs.
anyhow = "1.0" # Adapter error handling.
cargo-about = "0.9.3" # Review shared API dependencies below when updating.
clap = { version = "4.6", features = ["derive"] } # Adapter CLI parsing.
codespan = "0.13" # Shared cargo-about API: keep compatible with its dependency requirement.
codespan-reporting = "0.13" # Shared cargo-about API: keep compatible with its dependency requirement.
env_logger = { version = "0.11", default-features = false } # Adapter logging setup.
handlebars = "6.4" # Adapter template rendering.
krates = "0.21" # Shared cargo-about API: keep compatible with its dependency requirement.
log = "0.4" # Adapter diagnostics.
rustls = { version = "0.23", default-features = false, features = ["ring"] } # Must match the API used by ureq's rustls backend.
toml-span = "0.7" # Shared cargo-about API: keep compatible with its dependency requirement.
ureq = { version = "3.5", default-features = false, features = ["platform-verifier", "rustls-no-provider"] } # Shared cargo-about API: keep compatible with its dependency requirement.

[lib]
name = "arista_pre_commit_hooks"
path = "src/lib.rs"

[[bin]]
name = "cargo-fmt-hook"
path = "src/bin/cargo-fmt-hook.rs"

[[bin]]
name = "cargo-fmt-nightly-hook"
path = "src/bin/cargo-fmt-nightly-hook.rs"

[[bin]]
name = "cargo-check-hook"
path = "src/bin/cargo-check-hook.rs"

[[bin]]
name = "cargo-clippy-hook"
path = "src/bin/cargo-clippy-hook.rs"

[[bin]]
name = "cargo-deny-hook"
path = "src/bin/cargo-deny-hook.rs"

[[bin]]
name = "cargo-about-hook"
path = "src/bin/cargo-about-hook.rs"
